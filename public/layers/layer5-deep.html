<!DOCTYPE html>
<html>
<head>
<style>
* { margin: 0; padding: 0; }
body { width: 960px; height: 540px; overflow: hidden; background: transparent; }
.scene {
  width: 960px;
  height: 540px;
  position: relative;
  overflow: hidden;
}

/* Heavy dark gradient */
.darkness {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: linear-gradient(180deg, transparent 0%, rgba(5, 8, 12, 0.5) 20%, rgba(3, 5, 8, 0.8) 50%, rgba(2, 3, 5, 0.95) 100%);
}

/* Surgical light overhead */
.surgical-light {
  position: absolute;
  top: 60px; left: 420px;
  width: 120px; height: 20px;
  background: rgba(220, 230, 240, 0.2);
  border-radius: 10px;
  box-shadow: 0 0 30px rgba(220, 230, 240, 0.1);
}
.surgical-arm {
  position: absolute;
  top: 0; left: 478px;
  width: 4px; height: 60px;
  background: #1a2530;
}
.surgical-glow {
  position: absolute;
  top: 80px; left: 380px;
  width: 200px; height: 300px;
  background: radial-gradient(ellipse 100% 100% at 50% 0%, rgba(220, 230, 240, 0.06) 0%, transparent 60%);
}

/* Status indicator lights */
.status-dot {
  position: absolute;
  width: 4px; height: 4px;
  border-radius: 50%;
}
.sd-green {
  background: #22c55e;
  box-shadow: 0 0 6px rgba(34, 197, 94, 0.5);
}
.sd-red {
  background: #ef4444;
  box-shadow: 0 0 6px rgba(239, 68, 68, 0.5);
}
.sd-amber {
  background: #f59e0b;
  box-shadow: 0 0 6px rgba(245, 158, 11, 0.5);
}
.sd-teal {
  background: #2dd4bf;
  box-shadow: 0 0 6px rgba(45, 212, 191, 0.5);
}
.s1 { top: 180px; left: 260px; }
.s2 { top: 184px; left: 270px; }
.s3 { top: 182px; left: 280px; }
.s4 { top: 220px; right: 250px; }
.s5 { top: 224px; right: 260px; }
.s6 { top: 350px; left: 300px; }
.s7 { top: 354px; left: 310px; }
.s8 { top: 300px; right: 280px; }

/* Instrument tray */
.tray {
  position: absolute;
  top: 280px; left: 300px;
  width: 80px; height: 6px;
  background: #1a2530;
  border-radius: 1px;
}
.tray-leg {
  position: absolute;
  top: 286px; left: 338px;
  width: 3px; height: 60px;
  background: #15202a;
}
/* Instrument shapes on tray */
.inst1 {
  position: absolute;
  top: 275px; left: 310px;
  width: 2px; height: 10px;
  background: #3a4a5a;
  transform: rotate(-10deg);
}
.inst2 {
  position: absolute;
  top: 274px; left: 320px;
  width: 2px; height: 12px;
  background: #3a4a5a;
  transform: rotate(5deg);
}
.inst3 {
  position: absolute;
  top: 276px; left: 330px;
  width: 8px; height: 4px;
  background: #3a4a5a;
  border-radius: 1px;
}
.inst4 {
  position: absolute;
  top: 273px; left: 345px;
  width: 2px; height: 14px;
  background: #3a4a5a;
  transform: rotate(-3deg);
}
.inst5 {
  position: absolute;
  top: 276px; left: 358px;
  width: 12px; height: 3px;
  background: #3a4a5a;
  border-radius: 1px;
}

/* Ventilator/machine shape */
.machine {
  position: absolute;
  top: 200px; right: 240px;
  width: 50px; height: 70px;
  background: #0d1520;
  border: 1px solid #1a2530;
  border-radius: 3px;
}
.machine-screen {
  position: absolute;
  top: 206px; right: 246px;
  width: 38px; height: 20px;
  background: #060a10;
  border-radius: 1px;
}
.machine-wave {
  position: absolute;
  top: 215px; right: 250px;
  width: 30px; height: 1px;
  background: transparent;
  box-shadow:
    0px 0px rgba(45, 212, 191, 0.6),
    4px -3px rgba(45, 212, 191, 0.6),
    8px 0px rgba(45, 212, 191, 0.6),
    12px 2px rgba(45, 212, 191, 0.6),
    16px -5px rgba(45, 212, 191, 0.6),
    20px 3px rgba(45, 212, 191, 0.6),
    24px 0px rgba(45, 212, 191, 0.6),
    28px -2px rgba(45, 212, 191, 0.6);
}

/* Deep corridor vanishing point */
.deep-corridor {
  position: absolute;
  top: 150px; left: 400px;
  width: 160px; height: 250px;
  background: linear-gradient(180deg, rgba(5, 8, 12, 0.3) 0%, rgba(2, 3, 5, 0.6) 100%);
  border-left: 1px solid rgba(26, 37, 48, 0.3);
  border-right: 1px solid rgba(26, 37, 48, 0.3);
}

/* Bottom darkness vignette */
.vignette-bottom {
  position: absolute;
  bottom: 0; left: 0;
  width: 100%; height: 200px;
  background: linear-gradient(180deg, transparent 0%, rgba(2, 3, 5, 0.9) 100%);
}

/* Side vignettes */
.vignette-left {
  position: absolute;
  top: 0; left: 0;
  width: 250px; height: 100%;
  background: linear-gradient(90deg, rgba(2, 3, 5, 0.7) 0%, transparent 100%);
}
.vignette-right {
  position: absolute;
  top: 0; right: 0;
  width: 250px; height: 100%;
  background: linear-gradient(270deg, rgba(2, 3, 5, 0.7) 0%, transparent 100%);
}
</style>
</head>
<body>
<div class="scene">
  <div class="darkness"></div>
  <div class="deep-corridor"></div>
  <div class="surgical-arm"></div>
  <div class="surgical-glow"></div>
  <div class="surgical-light"></div>
  <div class="tray"></div>
  <div class="tray-leg"></div>
  <div class="inst1"></div><div class="inst2"></div><div class="inst3"></div>
  <div class="inst4"></div><div class="inst5"></div>
  <div class="machine"></div>
  <div class="machine-screen"></div>
  <div class="machine-wave"></div>
  <div class="status-dot sd-green s1"></div>
  <div class="status-dot sd-red s2"></div>
  <div class="status-dot sd-green s3"></div>
  <div class="status-dot sd-amber s4"></div>
  <div class="status-dot sd-teal s5"></div>
  <div class="status-dot sd-red s6"></div>
  <div class="status-dot sd-green s7"></div>
  <div class="status-dot sd-teal s8"></div>
  <div class="vignette-bottom"></div>
  <div class="vignette-left"></div>
  <div class="vignette-right"></div>
</div>
</body>
</html>
