<!DOCTYPE html>
<html>
<head>
<style>
* { margin: 0; padding: 0; }
body { width: 960px; height: 540px; overflow: hidden; background: transparent; }
.scene {
  width: 960px;
  height: 540px;
  position: relative;
  overflow: hidden;
}

/* Ground/floor level */
.ground {
  position: absolute;
  bottom: 0; left: 0;
  width: 100%; height: 160px;
  background: linear-gradient(180deg, #0e1218 0%, #0a0d12 100%);
}

/* Entrance awning/overhang */
.awning {
  position: absolute;
  bottom: 160px; left: 300px;
  width: 360px; height: 20px;
  background: linear-gradient(180deg, #1a2a30 0%, #15222a 100%);
  border-bottom: 3px solid #2dd4bf;
  box-shadow: 0 4px 20px rgba(45, 212, 191, 0.3);
}
.awning-support-l {
  position: absolute;
  bottom: 60px; left: 310px;
  width: 6px; height: 100px;
  background: #1a2530;
}
.awning-support-r {
  position: absolute;
  bottom: 60px; right: 310px;
  width: 6px; height: 100px;
  background: #1a2530;
}

/* Teal horizontal accent line */
.teal-line {
  position: absolute;
  bottom: 160px; left: 0;
  width: 100%; height: 3px;
  background: #2dd4bf;
  box-shadow: 0 0 20px rgba(45, 212, 191, 0.5), 0 0 40px rgba(45, 212, 191, 0.2);
}

/* Glass doors */
.door-frame {
  position: absolute;
  bottom: 10px; left: 400px;
  width: 160px; height: 150px;
  border: 3px solid #1e3040;
  background: linear-gradient(180deg, rgba(45, 212, 191, 0.08) 0%, rgba(255, 200, 100, 0.12) 100%);
}
.door-left {
  position: absolute;
  bottom: 10px; left: 403px;
  width: 76px; height: 146px;
  border-right: 2px solid #1e3040;
  background: linear-gradient(180deg, rgba(45, 212, 191, 0.05) 0%, rgba(255, 200, 100, 0.08) 100%);
}
.door-right {
  position: absolute;
  bottom: 10px; left: 481px;
  width: 76px; height: 146px;
  background: linear-gradient(180deg, rgba(45, 212, 191, 0.05) 0%, rgba(255, 200, 100, 0.08) 100%);
}
/* Door handles */
.handle-l {
  position: absolute;
  bottom: 75px; left: 468px;
  width: 4px; height: 20px;
  background: #3a5060;
}
.handle-r {
  position: absolute;
  bottom: 75px; left: 488px;
  width: 4px; height: 20px;
  background: #3a5060;
}

/* Warm interior glow from doors */
.glow {
  position: absolute;
  bottom: 0; left: 380px;
  width: 200px; height: 170px;
  background: radial-gradient(ellipse 100% 100% at 50% 20%, rgba(255, 200, 100, 0.15) 0%, transparent 70%);
}

/* Side windows flanking entrance */
.side-win {
  position: absolute;
  width: 50px; height: 70px;
  background: linear-gradient(180deg, rgba(45, 212, 191, 0.06) 0%, rgba(255, 200, 100, 0.1) 100%);
  border: 2px solid #1e3040;
}
.sw1 { bottom: 60px; left: 320px; }
.sw2 { bottom: 60px; right: 320px; }

/* Entrance sign */
.sign {
  position: absolute;
  bottom: 185px; left: 420px;
  width: 120px; height: 16px;
  background: rgba(45, 212, 191, 0.15);
  border: 1px solid rgba(45, 212, 191, 0.3);
  border-radius: 2px;
}
.sign-text {
  position: absolute;
  bottom: 187px; left: 435px;
  color: #2dd4bf;
  font-family: monospace;
  font-size: 10px;
  letter-spacing: 4px;
  text-shadow: 0 0 8px rgba(45, 212, 191, 0.5);
}

/* Sidewalk lines */
.sidewalk {
  position: absolute;
  bottom: 0; left: 250px;
  width: 460px; height: 10px;
  background: #161c22;
  border-top: 1px solid #1e2630;
}
</style>
</head>
<body>
<div class="scene">
  <div class="ground"></div>
  <div class="glow"></div>
  <div class="teal-line"></div>
  <div class="awning"></div>
  <div class="awning-support-l"></div>
  <div class="awning-support-r"></div>
  <div class="door-frame"></div>
  <div class="door-left"></div>
  <div class="door-right"></div>
  <div class="handle-l"></div>
  <div class="handle-r"></div>
  <div class="side-win sw1"></div>
  <div class="side-win sw2"></div>
  <div class="sign"></div>
  <div class="sign-text">EMERGENCY</div>
  <div class="sidewalk"></div>
</div>
</body>
</html>
